<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Basket | Premium Store</title>

<meta name="description" content="Smart Basket - Premium quality. Smart choices. Budget friendly.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"DM Sans",sans-serif;
  background:#080808;
  color:#f5f1e8;
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.offer-bar{
  background:#c9a45c;
  color:#090909;
  text-align:center;
  padding:8px 15px;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
}

.navbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(201,164,92,.18);
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:"Cormorant Garamond",serif;
  font-size:31px;
  font-weight:700;
  letter-spacing:2px;
  color:#d7b66c;
}

.logo span{
  display:block;
  font-family:"DM Sans",sans-serif;
  font-size:8px;
  letter-spacing:4px;
  color:#aaa;
  margin-top:-7px;
}

.nav-links{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-links a{
  font-size:13px;
  color:#ccc;
}

.nav-links a:hover{
  color:#d7b66c;
}

.cart-btn{
  border:1px solid #d7b66c;
  background:transparent;
  color:#d7b66c;
  padding:9px 15px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.hero{
  min-height:600px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 75% 40%,rgba(201,164,92,.14),transparent 30%),
    #080808;
}

.hero-inner{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:75px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.eyebrow{
  color:#d7b66c;
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  margin-bottom:18px;
}

.hero h1{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(50px,7vw,90px);
  line-height:.9;
  font-weight:600;
  margin-bottom:25px;
}

.hero h1 span{
  color:#d7b66c;
}

.hero p{
  max-width:480px;
  color:#aaa;
  font-size:16px;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:13px 23px;
  border-radius:4px;
  font-size:13px;
  font-weight:700;
  border:1px solid #d7b66c;
}

.btn-gold{
  background:#d7b66c;
  color:#080808;
}

.btn-outline{
  background:transparent;
  color:#d7b66c;
}

.hero-image{
  position:relative;
}

.hero-image img{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:12px;
  display:block;
}

.section{
  max-width:1200px;
  margin:auto;
  padding:80px 20px;
}

.section-title{
  text-align:center;
  margin-bottom:45px;
}

.section-title small{
  color:#d7b66c;
  font-size:11px;
  letter-spacing:3px;
  font-weight:700;
}

.section-title h2{
  font-family:"Cormorant Garamond",serif;
  font-size:48px;
  margin-top:8px;
}

.trust{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:30px;
}

.trust-card{
  border:1px solid rgba(201,164,92,.2);
  padding:25px 20px;
  text-align:center;
  background:#0e0e0e;
  border-radius:8px;
}

.trust-card strong{
  display:block;
  color:#d7b66c;
  font-size:15px;
  margin-bottom:5px;
}

.trust-card span{
  color:#888;
  font-size:12px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(1,1fr);
  max-width:430px;
  margin:auto;
}

.product-card{
  background:#101010;
  border:1px solid rgba(201,164,92,.2);
  border-radius:10px;
  overflow:hidden;
  transition:.3s;
}

.product-card:hover{
  transform:translateY(-5px);
  border-color:rgba(201,164,92,.5);
}

.product-image{
  height:390px;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-info{
  padding:22px;
}

.product-tag{
  color:#d7b66c;
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  text-transform:uppercase;
}

.product-info h3{
  font-family:"Cormorant Garamond",serif;
  font-size:28px;
  line-height:1.05;
  margin:8px 0 12px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.price{
  font-size:24px;
  color:#d7b66c;
  font-weight:700;
}

.old-price{
  color:#777;
  text-decoration:line-through;
  font-size:14px;
}

.product-info p{
  color:#999;
  font-size:13px;
  margin-bottom:20px;
}

.product-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-btn{
  padding:12px;
  border-radius:4px;
  border:1px solid #d7b66c;
  background:transparent;
  color:#d7b66c;
  font-weight:700;
  font-size:12px;
}

.action-btn.primary{
  background:#d7b66c;
  color:#080808;
}

.about{
  background:#0e0e0e;
  border-top:1px solid rgba(201,164,92,.15);
  border-bottom:1px solid rgba(201,164,92,.15);
}

.about-box{
  max-width:750px;
  margin:auto;
  text-align:center;
}

.about-box p{
  color:#999;
  font-size:15px;
}

.contact{
  text-align:center;
}

.contact p{
  color:#999;
  margin:8px 0;
}

footer{
  border-top:1px solid rgba(201,164,92,.15);
  padding:35px 20px;
  text-align:center;
  color:#777;
  font-size:12px;
}

footer strong{
  color:#d7b66c;
}

.whatsapp{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:80;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25D366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:900px;
  max-height:90vh;
  overflow:auto;
  background:#101010;
  border:1px solid rgba(201,164,92,.3);
  border-radius:12px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#222;
  border:1px solid #444;
  color:#fff;
  font-size:20px;
}

.modal-content{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  margin-top:20px;
}

.modal-main-image{
  background:#f1f1f1;
  border-radius:8px;
  height:420px;
  padding:10px;
}

.modal-main-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.thumbs{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.thumb{
  width:70px;
  height:70px;
  background:#eee;
  border:2px solid transparent;
  border-radius:5px;
  padding:3px;
}

.thumb.active{
  border-color:#d7b66c;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.modal-details{
  padding:10px;
}

.modal-details .tag{
  color:#d7b66c;
  font-size:11px;
  letter-spacing:2px;
}

.modal-details h2{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  line-height:1;
  margin:10px 0 15px;
}

.modal-details .desc{
  color:#999;
  font-size:14px;
  margin-bottom:20px;
}

.feature-list{
  list-style:none;
  margin-bottom:20px;
}

.feature-list li{
  color:#bbb;
  font-size:13px;
  margin:8px 0;
}

.feature-list li::before{
  content:"✓";
  color:#d7b66c;
  margin-right:8px;
}

.modal-price{
  color:#d7b66c;
  font-size:28px;
  font-weight:700;
  margin-bottom:20px;
}

.buy{
  width:100%;
  border:0;
  padding:14px;
  background:#d7b66c;
  color:#080808;
  font-weight:700;
  border-radius:4px;
}

.cart-panel{
  position:fixed;
  top:0;
  right:-430px;
  width:min(430px,100%);
  height:100vh;
  background:#101010;
  z-index:120;
  border-left:1px solid rgba(201,164,92,.25);
  transition:.3s;
  padding:25px;
  overflow:auto;
}

.cart-panel.open{
  right:0;
}

.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.cart-head h2{
  font-family:"Cormorant Garamond",serif;
  font-size:32px;
}

.cart-close{
  background:none;
  border:0;
  color:#fff;
  font-size:25px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #252525;
}

.cart-item img{
  width:75px;
  height:75px;
  object-fit:contain;
  background:#eee;
  border-radius:5px;
}

.cart-item-info{
  flex:1;
}

.cart-item-info strong{
  display:block;
  font-size:13px;
}

.cart-item-info span{
  color:#d7b66c;
  font-size:14px;
}

.empty{
  color:#777;
  text-align:center;
  padding:50px 10px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  padding:20px 0;
  font-weight:700;
}

@media(max-width:800px){

  .nav-links{
    display:none;
  }

  .hero-inner{
    grid-template-columns:1fr;
    padding-top:55px;
    text-align:center;
  }

  .hero p{
    margin-left:auto;
    margin-right:auto;
  }

  .hero-buttons{
    justify-content:center;
  }

  .hero-image{
    order:-1;
  }

  .hero-image img{
    max-height:320px;
  }

  .trust{
    grid-template-columns:1fr;
  }

  .modal-content{
    grid-template-columns:1fr;
  }

  .modal-main-image{
    height:300px;
  }

  .modal-details h2{
    font-size:32px;
  }
}

</style>
</head>

<body>

<div class="offer-bar">
  PREMIUM QUALITY • SMART CHOICES • BUDGET FRIENDLY
</div>

<nav class="navbar">
  <div class="nav-inner">

    <a href="#" class="logo">
      SMART BASKET
      <span>PREMIUM STORE</span>
    </a>

    <div class="nav-links">
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <button class="cart-btn" onclick="openCart()">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>

    <button class="cart-btn" onclick="openCart()">
      Cart (<span id="mobileCartCount">0</span>)
    </button>

  </div>
</nav>

<section class="hero">

  <div class="hero-inner">

    <div>
      <div class="eyebrow">SMART BASKET • PREMIUM STORE</div>

      <h1>
        SHOP<br>
        <span>SMARTER.</span>
      </h1>

      <p>
        Premium quality. Smart choices. Budget friendly.
        Discover useful products selected for modern everyday living.
      </p>

      <div class="hero-buttons">
        <a href="#shop" class="btn btn-gold">SHOP NOW</a>
        <a href="#about

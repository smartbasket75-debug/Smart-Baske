<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Smart Baske In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body.menu-open {
      overflow: hidden;
    }

    .font-instrument {
      font-family: 'Instrument Serif', serif;
    }

    :root {
      --entrance: cubic-bezier(0.16, 1, 0.3, 1);
      --overlay: cubic-bezier(0.76, 0, 0.24, 1);
    }

    /* ================= NAVBAR ================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      transition: 0.5s;
    }

    .navbar.scrolled {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(15px);
    }

    .nav-inner {
      max-width: 1440px;
      height: 64px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      z-index: 101;

      opacity: 0;
      transform: translateY(-16px);
      transition: all 700ms var(--entrance);
    }

    .nav-loaded .logo {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-center {
      z-index: 101;
    }

    .navigate-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;

      padding: 8px 20px;

      color: rgba(255,255,255,0.9);
      cursor: pointer;

      font-size: 14px;

      opacity: 0;
      transform: translateY(-16px);

      transition:
        background 0.3s,
        opacity 700ms var(--entrance) 200ms,
        transform 700ms var(--entrance) 200ms;
    }

    .nav-loaded .navigate-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .navigate-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 101;
    }

    .flower {
      color: rgba(255,255,255,0.9);
      font-size: 30px;

      opacity: 0;
      transform: translateY(-16px);

      transition:
        opacity 700ms var(--entrance) 400ms,
        transform 700ms var(--entrance) 400ms;
    }

    .nav-loaded .flower {
      opacity: 1;
      transform: translateY(0);
    }

    .cart-button {
      background: none;
      border: none;
      color: white;

      cursor: pointer;
      font-size: 14px;

      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mobile-menu {
      display: none;
      width: 32px;
      height: 32px;

      border: none;
      background: transparent;

      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 6px;
      cursor: pointer;
      z-index: 101;
    }

    .hamburger-bar {
      width: 24px;
      height: 2px;
      background: white;

      transition: 500ms var(--overlay);
    }

    .mobile-menu.open .hamburger-bar:first-child {
      transform: rotate(45deg) translateY(4px);
    }

    .mobile-menu.open .hamburger-bar:last-child {
      transform: rotate(-45deg) translateY(-4px);
    }

    /* ================= OVERLAY ================= */

    .menu-overlay {
      position: fixed;
      inset: 0;

      z-index: 90;

      background: black;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;

      transition: all 700ms var(--overlay);
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .menu-links a {
      text-decoration: none;
      color: white;

      font-family: 'Instrument Serif', serif;
      font-size: 40px;

      opacity: 0;
      transform: translateY(24px);

      transition:
        opacity 600ms var(--overlay),
        transform 600ms var(--overlay);
    }

    .menu-links a:hover {
      opacity: 0.6;
    }

    .menu-overlay.open .menu-links a {
      opacity: 1;
      transform: translateY(0);
    }

    .menu-overlay.open .menu-links a:nth-child(1) {
      transition-delay: 150ms;
    }

    .menu-overlay.open .menu-links a:nth-child(2) {
      transition-delay: 230ms;
    }

    .menu-overlay.open .menu-links a:nth-child(3) {
      transition-delay: 310ms;
    }

    .menu-overlay.open .menu-links a:nth-child(4) {
      transition-delay: 390ms;
    }

    /* ================= HERO ================= */

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;

      overflow: hidden;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hero-video-wrap {
      position: absolute;
      inset: 0;

      opacity: 0;
      transform: scale(1.05);

      transition:
        opacity 1400ms var(--entrance),
        transform 1400ms var(--entrance);
    }

    .hero-video-wrap.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .hero-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      position: relative;
      z-index: 10;

      width: 100%;
      max-width: 1000px;

      margin: 0 auto;
      padding: 0 24px 64px;

      text-align: center;
    }

    .hero-title,
    .hero-text,
    .hero-cta {
      opacity: 0;
      transform: translateY(32px);
    }

    .hero-content.loaded .hero-title {
      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 900ms var(--entrance) 400ms,
        transform 900ms var(--entrance) 400ms;
    }

    .hero-content.loaded .hero-text {
      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 900ms var(--entrance) 600ms,
        transform 900ms var(--entrance) 600ms;
    }

    .hero-content.loaded .hero-cta {
      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 900ms var(--entrance) 800ms,
        transform 900ms var(--entrance) 800ms;
    }

    .hero-title {
      font-family: 'Instrument Serif', serif;

      color: white;

      font-size: 2.5rem;
      line-height: 0.95;

      margin-bottom: 20px;
    }

    .hero-text {
      max-width: 450px;
      margin: 0 auto 32px;

      color: rgba(255,255,255,0.7);

      font-size: 16px;
      line-height: 1.5;
    }

    .hero-cta {
      display: inline-block;

      background: white;
      color: black;

      padding: 14px 32px;

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;

      border: none;
    }

    .hero-cta:hover {
      background: rgba(255,255,255,0.9);
    }

    /* ================= OFFER ================= */

    .offer {
      background: black;
      color: rgba(255,255,255,0.8);

      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);

      padding: 24px;

      text-align: center;

      font-size: 14px;
    }

    /* ================= PRODUCTS ================= */

    .products-section {
      background: black;
      color: white;

      padding: 80px 24px;
    }

    .products-container {
      max-width: 1440px;
      margin: auto;
    }

    .products-header {
      display: flex;
      flex-direction: column;

      gap: 30px;

      margin-bottom: 50px;
    }

    .small-title {
      margin-bottom: 12px;

      color: rgba(255,255,255,0.4);

      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .section-title {
      font-family: 'Instrument Serif', serif;

      font-size: 48px;
      line-height: 1;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;

      width: 100%;

      padding-bottom: 12px;

      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .search-box input {
      width: 100%;

      background: transparent;
      border: none;
      outline: none;

      color: white;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr;

      gap: 50px 24px;
    }

    .product-card {
      width: 100%;
    }

    .product-image {
      position: relative;

      width: 100%;
      aspect-ratio: 3 / 4;

      overflow: hidden;
      background: #18181b;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: transform 700ms;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }

    .category {
      position: absolute;
      top: 16px;
      left: 16px;

      padding: 6px 12px;

      border-radius: 999px;

      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);

      font-size: 11px;
    }

    .product-info {
      padding-top: 20px;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .product-name {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .product-subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
    }

    .price {
      text-align: right;
      white-space: nowrap;
    }

    .old-price {
      color: rgba(255,255,255,0.4);

      font-size: 12px;
      text-decoration: line-through;

      margin-top: 5px;
    }

    .product-actions {
      display: flex;
      gap: 10px;

      margin-top: 20px;
    }

    .add-btn {
      flex: 1;

      padding: 13px;

      background: white;
      color: black;

      border: none;
      border-radius: 999px;

      cursor: pointer;

      font-weight: 500;
    }

    .buy-btn {
      padding: 13px 20px;

      background: transparent;
      color: white;

      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;

      cursor: pointer;
    }

    /* ================= COD ================= */

    .cod-section {
      background: #09090b;

      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);

      padding: 80px 24px;

      color: white;
      text-align: center;
    }

    .cod-title {
      font-family: 'Instrument Serif', serif;
      font-size: 48px;
    }

    .cod-text {
      max-width: 500px;
      margin: 20px auto 0;

      color: rgba(255,255,255,0.6);
      line-height: 1.6;
    }

    /* ================= CART ================= */

    .cart-overlay {
      position: fixed;
      inset: 0;

      z-index: 200;

      pointer-events: none;
    }

    .cart-overlay.active {
      pointer-events: auto;
    }

    .cart-bg {
      position: absolute;
      inset: 0;

      background: rgba(0,0,0,0.7);

      opacity: 0;

      transition: 0.3s;
    }

    .cart-overlay.active .cart-bg {
      opacity: 1;
    }

    .cart {
      position: absolute;
      top: 0;
      right: 0;

      width: 100%;
      max-width: 450px;
      height: 100%;

      background: #09090b;

      padding: 24px;

      display: flex;
      flex-direction: column;

      transform: translateX(100%);

      transition: transform 500ms var(--overlay);
    }

    .cart-overlay.active .cart {
      transform: translateX(0);
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-bottom: 20px;

      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .cart-title {
      font-family: 'Instrument Serif', serif;
      font-size: 32px;
    }

    .close-btn {
      background: none;
      border: none;

      color: white;
      font-size: 26px;

      cursor: pointer;
    }

    .cart-items {
      flex: 1;

      overflow-y: auto;

      padding: 24px 0;
    }

    .empty-cart {
      text-align: center;
      color: rgba(255,255,255,0.4);

      margin-top: 40px;
    }

    .cart-item {
      display: flex;
      gap: 15px;

      padding-bottom: 20px;
      margin-bottom: 20px;

      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .cart-item img {
      width: 65px;
      height: 85px;

      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item-name {
      font-size: 14px;
    }

    .cart-item-price {
      color: rgba(255,255,255,0.6);
      font-size: 13px;

      margin-top: 6px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: 15px;
    }

    .quantity button {
      width: 28px;
      height: 28px;

      border-radius: 50%;

      background: transparent;
      color: white;

      border: 1px solid rgba(255,255,255,0.2);

      cursor: pointer;
    }

    .cart-footer {
      padding-top: 20px;

      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .total-row {
      display: flex;
      justify-content: space-between;

      margin-bottom: 14px;

      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }

    .discount {
      color: #4ade80;
    }

    .final-total {
      color: white;
      font-size: 18px;
    }

    .checkout-btn {
      width: 100%;

      margin-top: 15px;

      padding: 16px;

      background: white;
      color: black;

      border: none;
      border-radius: 999px;

      font-weight: 600;

      cursor: pointer;
    }

    /* ================= CHECKOUT ================= */

    .checkout-overlay {
      position: fixed;
      inset: 0;

      z-index: 300;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,0.85);

      opacity: 0;
      visibility: hidden;

      transition: 0.3s;
    }

    .checkout-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .checkout-box {
      position: relative;

      width: 100%;
      max-width: 600px;

      max-height: 90vh;
      overflow-y: auto;

      padding: 30px;

      background: #09090b;
      color: white;
    }

    .checkout-box h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 40px;
    }

    .checkout-description {
      margin-top: 10px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }

    .checkout-form {
      margin-top: 30px;
    }

    .checkout-form input,
    .checkout-form textarea {
      width: 100%;

      margin-bottom: 20px;
      padding: 14px 0;

      background: transparent;

      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);

      outline: none;

      color: white;

      font-size: 15px;
    }

    .checkout-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .checkout-summary {
      padding: 20px;

      border: 1px solid rgba(255,255,255,0.1);

      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;

      margin-bottom: 15px;

      color: rgba(255,255,255,0.6);
    }

    .place-order {
      width: 100%;

      padding: 16px;

      border: none;
      border-radius: 999px;

      background: white;
      color: black;

      font-weight: 600;

      cursor: pointer;
    }

    /* ================= RESPONSIVE ================= */

    @media (min-width: 640px) {
      .hero-title {
        font-size: 48px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 768px) {

      .nav-inner {
        height: 80px;
        padding: 0 40px;
      }

      .logo {
        font-size: 24px;
      }

      .mobile-menu {
        display: none;
      }

      .nav-center {
        display: block;
      }

      .flower,
      .cart-button {
        display: flex;
      }

      .hero-content {
        padding-bottom: 96px;
      }

      .hero-title {
        font-size: 60px;
        margin-bottom: 24px;
      }

      .hero-text {
        font-size: 18px;
        margin-bottom: 40px;
      }

      .hero-cta {
        font-size: 16px;
      }

      .menu-links a {
        font-size: 60px;
      }

      .products-section {
        padding: 110px 40px;
      }

      .products-header {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
      }

      .search-box {
        max-width: 350px;
      }

      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .section-title,
      .cod-title {
        font-size: 60px;
      }
    }

    @media (min-width: 1024px) {
      .hero-title {
        font-size: 72px;
      }
    }

    @media (max-width: 767px) {
      .nav-center,
      .flower,
      .cart-button {
        display: none;
      }

      .mobile-menu {
        display: flex;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <header class="navbar" id="navbar">
    <div class="nav-inner" id="navInner">

      <a href="#" class="logo">
        Smart Baske In
      </a>

      <div class="nav-center">
        <button class="navigate-btn" id="menuButton">
          Navigate
        </button>
      </div>

      <div class="nav-right">

        <button class="cart-button" id="cartButton">
          🛍 Cart
          <span id="cartCount">0</span>
        </button>

        <div class="flower">
          ❋
        </div>

        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Toggle menu"
        >
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>

      </div>

    </div>
  </header>


  <!-- ================= MENU ================= -->

  <div class="menu-overlay" id="menuOverlay">

    <div class="menu-links">

      <a href="#" data-menu="home">
        Home
      </a>

      <a href="#">
        Story
      </a>

      <a href="#products" data-menu="products">
        Collection
      </a>

      <a href="#products" data-menu="products">
        Products
      </a>

      <a href="#">
        Inquire
      </a>

    </div>

  </div>


  <!-- ================= HERO ================= -->

  <section class="hero" id="home">

    <div class="hero-video-wrap" id="videoWrap">

      <video
        class="hero-video"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260819_212700_3bb9329b-5c50-4257-a09b-ca85cf3654a3.mp4"
        autoplay
        muted
        loop
        playsinline
      ></video>

    </div>


    <div class="hero-content" id="heroContent">

      <h1 class="hero-title">
        A carefully curated<br class="hero-break">
        collection beyond compare
      </h1>

      <p class="hero-text">
        Discover trending products, carefully selected for you.
      </p>

      <button class="hero-cta" id="shopNow">
        Shop Collection
      </button>

    </div>

  </section>


  <!-- ================= OFFER ================= -->

  <section class="offer">
    🎉 FIRST ORDER? GET <strong>20% OFF</strong>
    — USE CODE: FIRST20
  </section>


  <!-- ================= PRODUCTS ================= -->

  <section class="products-section" id="products">

    <div class="products-container">

      <div class="products-header">

        <div>

          <p class="small-title">
            Smart Baske In
          </p>

          <h2 class="section-title">
            Our Collection
          </h2>

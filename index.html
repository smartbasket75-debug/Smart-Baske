<div class="price-card">
  <div class="price-label">USDT / INR</div>
  <div class="live-status">
    <span class="live-dot"></span> LIVE MARKET PRICE
  </div>

  <h1 id="livePrice">Loading...</h1>
  <p id="priceUpdated">Fetching market data</p>
</div>

<style>
.price-card {
  background: linear-gradient(135deg, #10251a, #080d0b);
  border: 1px solid #245d39;
  border-radius: 20px;
  padding: 24px;
  color: white;
  margin: 20px 0;
  box-shadow: 0 10px 35px #0008;
}

.price-label {
  color: #9baea1;
  font-size: 14px;
}

.live-status {
  color: #35e879;
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 15px;
}

.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #35e879;
  border-radius: 50%;
  margin-right: 5px;
}

#livePrice {
  font-size: 36px;
  color: #35e879;
  margin: 12px 0;
}

#priceUpdated {
  font-size: 12px;
  color: #9baea1;
}
</style>

<script>
async function updateUSDTPrice() {
  const price = document.getElementById("livePrice");
  const updated = document.getElementById("priceUpdated");

  try {
    const response = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=inr&include_last_updated_at=true"
    );

    if (!response.ok) {
      throw new Error("Price unavailable");
    }

    const data = await response.json();
    const marketPrice = data.tether.inr;

    price.textContent = new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR"
    }).format(marketPrice);

    updated.textContent =
      "Market data updated: " +
      new Date(data.tether.last_updated_at * 1000)
        .toLocaleTimeString("en-IN");

  } catch (error) {
    price.textContent = "Price unavailable";
    updated.textContent = "Please try again later.";
  }
}

updateUSDTPrice();
setInterval(updateUSDTPrice, 60000);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Baske IN | Shop Smart. Live Better.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"DM Sans",sans-serif;
  background:#f7f4ef;
  color:#171717;
  overflow-x:hidden;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   OFFER BAR
========================= */

.offer-bar{
  background:#171717;
  color:#fff;
  padding:11px;
  text-align:center;
  font-size:11px;
  font-weight:600;
  letter-spacing:2px;
}

/* =========================
   NAVBAR
========================= */

nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(247,244,239,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #e7e0d8;
}

.nav-container{
  max-width:1300px;
  margin:auto;
  padding:17px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:"Cormorant Garamond",serif;
  font-size:31px;
  font-weight:700;
}

.nav-links{
  display:flex;
  gap:25px;
  font-size:13px;
  font-weight:600;
}

.nav-links a:hover{
  opacity:.5;
}

.cart-btn{
  background:#171717;
  color:#fff;
  border:none;
  padding:11px 18px;
  border-radius:30px;
  font-weight:600;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 20px;
  background:
  radial-gradient(circle at 10% 20%,#ead9c5,transparent 32%),
  radial-gradient(circle at 90% 80%,#ddd0c0,transparent 32%);
  overflow:hidden;
}

.hero-content{
  max-width:900px;
  animation:fadeUp 1s ease;
}

.hero-tag{
  display:inline-block;
  border:1px solid #222;
  padding:9px 18px;
  border-radius:30px;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:25px;
}

.hero h1{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(58px,9vw,115px);
  line-height:.9;
  letter-spacing:-3px;
}

.hero p{
  max-width:600px;
  margin:28px auto;
  line-height:1.7;
  color:#555;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
  padding:15px 28px;
  border-radius:30px;
  font-size:14px;
  font-weight:600;
  transition:.3s;
}

.primary-btn{
  background:#171717;
  color:#fff;
}

.secondary-btn{
  border:1px solid #171717;
}

.primary-btn:hover{
  transform:translateY(-3px);
}

.secondary-btn:hover{
  background:#171717;
  color:#fff;
}

/* =========================
   TRUST
========================= */

.trust{
  max-width:1200px;
  margin:-35px auto 0;
  position:relative;
  z-index:2;
  padding:0 20px;
}

.trust-box{
  background:#fff;
  padding:28px;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.trust-item{
  text-align:center;
}

.trust-item div{
  font-size:25px;
}

.trust-item h4{
  margin-top:8px;
  font-size:14px;
}

.trust-item p{
  font-size:11px;
  color:#777;
  margin-top:5px;
}

/* =========================
   SECTION
========================= */

section{
  padding:90px 20px;
}

.container{
  max-width:1300px;
  margin:auto;
}

.section-title{
  text-align:center;
  margin-bottom:45px;
}

.section-title span{
  font-size:10px;
  letter-spacing:3px;
  color:#777;
}

.section-title h2{
  font-family:"Cormorant Garamond",serif;
  font-size:55px;
  margin-top:7px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.category-btn{
  background:#fff;
  border:1px solid #ddd6ce;
  padding:12px 18px;
  border-radius:30px;
  font-size:12px;
  font-weight:600;
}

.category-btn.active,
.category-btn:hover{
  background:#171717;
  color:#fff;
}

/* =========================
   SEARCH
========================= */

.search-box{
  max-width:650px;
  margin:0 auto 40px;
}

.search-box input{
  width:100%;
  padding:17px 20px;
  border-radius:40px;
  border:1px solid #ddd6ce;
  outline:none;
  background:#fff;
}

/* =========================
   PRODUCTS
========================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.product-card{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #ebe5dd;
  transition:.35s;
}

.product-card:hover{
  transform:translateY(-7px);
  box-shadow:0 20px 50px rgba(0,0,0,.1);
}

.product-image{
  height:270px;
  background:#eee8e0;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.product-card:hover img{
  transform:scale(1.07);
}

.product-info{
  padding:17px;
}

.badge{
  display:inline-block;
  font-size:9px;
  font-weight:700;
  letter-spacing:1px;
  padding:6px 9px;
  border-radius:20px;
  background:#f1e7dc;
  margin-bottom:9px;
}

.product-info h3{
  font-size:15px;
  line-height:1.4;
  min-height:42px;
}

.product-category{
  font-size:11px;
  color:#888;
  margin:7px 0;
}

.price-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin:13px 0;
}

.price{
  font-size:18px;
  font-weight:700;
}

.old-price{
  font-size:12px;
  color:#999;
  text-decoration:line-through;
}

.add-cart{
  width:100%;
  padding:13px;
  background:#171717;
  color:#fff;
  border:none;
  border-radius:30px;
  font-weight:600;
}

/* =========================
   INFO SECTION
========================= */

.about-box{
  background:#171717;
  color:#fff;
  padding:70px 25px;
  border-radius:30px;
  text-align:center;
}

.about-box h2{
  font-family:"Cormorant Garamond",serif;
  font-size:60px;
}

.about-box p{
  max-width:650px;
  margin:20px auto 0;
  color:#bbb;
  line-height:1.8;
}

/* =========================
   PAYMENT
========================= */

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.info-card{
  background:#fff;
  padding:28px;
  border-radius:20px;
  border:1px solid #e5ddd5;
}

.info-card h3{
  margin-bottom:12px;
}

.info-card p{
  font-size:13px;
  line-height:1.7;
  color:#666;
}

.info-value{
  margin-top:15px;
  background:#f3eee8;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  word-break:break-word;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#fff;
  padding:60px 20px 30px;
  border-top:1px solid #e5ddd5;
  text-align:center;
}

.footer-logo{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  font-weight:700;
}

.footer-text{
  color:#777;
  margin-top:10px;
}

.footer-contact{
  margin-top:22px;
  font-size:13px;
  line-height:1.9;
  color:#666;
}

/* =========================
   WHATSAPP
========================= */

.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25d366;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  z-index:2000;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

/* =========================
   CART
========================= */

.cart-panel{
  position:fixed;
  right:-450px;
  top:0;
  width:420px;
  max-width:100%;
  height:100vh;
  background:#fff;
  z-index:3000;
  padding:25px;
  transition:.4s;
  box-shadow:-20px 0 60px rgba(0,0,0,.15);
  overflow-y:auto;
}

.cart-panel.active{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.cart-header h2{
  font-family:"Cormorant Garamond",serif;
  font-size:36px;
}

.close-btn{
  background:none;
  border:none;
  font-size:30px;
}

.cart-item{
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.remove-btn{
  margin-top:6px;
  border:none;
  background:none;
  color:#c33;
}

.cart-total{
  font-size:20px;
  font-weight:700;
  margin:25px 0;
}

.checkout-btn{
  width:100%;
  padding:15px;
  border:none;
  background:#171717;
  color:#fff;
  border-radius:30px;
  font-weight:600;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:4000;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:520px;
  max-width:100%;
  max-height:90vh;
  overflow-y:auto;
